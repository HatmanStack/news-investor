name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_DEFAULT_REGION: us-east-1
      FINNHUB_API_KEY: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Read-only job: nothing here performs an authenticated git
          # operation, so the checkout token should not linger in
          # .git/config for the rest of the run.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install Node dependencies
        run: npm ci

      # `npm run check` starts with format:check, so this edition's CI should
      # too. It was absent, and an overlay that was unformatted in the pro
      # repository — where .prettierignore exempted the whole overlay tree —
      # landed here at an ordinary path and made `npm run check` fail for
      # anyone who ran it. Both sides are covered now: the exemption is gone
      # there, and the gate runs here.
      - name: Format check
        run: npx prettier --check .

      - name: Frontend type check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Frontend tests with coverage enforcement
        run: npm test -- --coverage --coverageReporters=text --coverageReporters=json-summary
      - name: Frontend coverage summary
        if: always()
        run: |
          if [ -f frontend/coverage/coverage-summary.json ]; then
            node -e "const c=require('./frontend/coverage/coverage-summary.json').total; \
              console.log('Frontend coverage (threshold 49/57/55/55 br/fn/ln/st):'); \
              console.log('  Branches:   '+c.branches.pct+'%'); \
              console.log('  Functions:  '+c.functions.pct+'%'); \
              console.log('  Lines:      '+c.lines.pct+'%'); \
              console.log('  Statements: '+c.statements.pct+'%');"
          fi

      - name: Backend type check
        run: cd backend && npx tsc --noEmit

      - name: Backend tests with coverage enforcement
        run: cd backend && npm test -- --ci --coverage --coverageReporters=text --coverageReporters=json-summary
      - name: Backend coverage summary
        if: always()
        run: |
          if [ -f backend/coverage/coverage-summary.json ]; then
            node -e "const c=require('./backend/coverage/coverage-summary.json').total; \
              console.log('Backend coverage (threshold 76/91/87/87 br/fn/ln/st):'); \
              console.log('  Branches:   '+c.branches.pct+'%'); \
              console.log('  Functions:  '+c.functions.pct+'%'); \
              console.log('  Lines:      '+c.lines.pct+'%'); \
              console.log('  Statements: '+c.statements.pct+'%');"
          fi

      - name: Python tests
        run: |
          pip install -r backend/python/requirements.txt
          pip install -r backend/python/requirements-dev.txt
          PYTHONPATH=backend/python pytest backend/python_tests --maxfail=1 -v

      # backend/python/pyproject.toml and backend/services/ml/mypy.ini both sync
      # to this edition, so the strictness they declare is enforced here too.
      # mypy resolves config from the working directory only, hence two runs
      # rather than one invocation with two paths -- and the two trees each
      # carry a top-level __init__.py, so a single run fails with "Duplicate
      # module named __main__".
      - name: Type check Python stocks Lambda
        run: mypy .
        working-directory: backend/python
      - name: Type check ML service
        run: mypy .
        working-directory: backend/services/ml

      # scripts/check-console-calls.sh is not in .sync/config.json
      # exclude_paths, so both the script and its baseline sync here. The gate
      # CONTRIBUTING promises should therefore exist in this edition too.
      - name: Console-call budget
        run: ./scripts/check-console-calls.sh

      - name: Markdownlint
        run: npm run lint:docs

      - name: Lychee link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.0.2
        with:
          args: '--no-progress --max-concurrency 8 *.md docs/**/*.md'
          fail: true
