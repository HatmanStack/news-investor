; mypy configuration for the sentiment ML service.
;
; This service was ruff-linted and type-checked by nothing. It cannot share
; backend/python's invocation: both trees carry a top-level __init__.py, and
; with explicit_package_bases mypy maps both to the module "__main__" and
; refuses to check either ("Duplicate module named __main__", errors prevented
; further checking). Two invocations, one strictness tier.
;
; A .ini rather than a pyproject.toml on purpose: ml-template-onnx.yaml sets
; CodeUri: services/ml/ with no BuildMethod, so `sam build` uses the default
; python builder against requirements.txt. Nothing here should look like a
; second package manifest.
;
; Settings mirror backend/python/pyproject.toml [tool.mypy], including the two
; flags this cycle tightened (disallow_untyped_defs, warn_return_any).
[mypy]
python_version = 3.13
; `.` is the package root. Without this, backend/services/__init__.py-less
; layout makes mypy call this directory the package `ml` while app.py imports
; `model_onnx` flat -- which is how it actually runs, since ml-template-onnx.yaml
; deploys these files at the root of the Lambda package.
explicit_package_bases = True
mypy_path = .
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
check_untyped_defs = True
disallow_incomplete_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True

; Runtime dependencies that ship no type stubs. Scoped per module rather than a
; global --ignore-missing-imports so that a *new* untyped import is a failure
; rather than a silence. These are the six in requirements.txt, plus numpy,
; which onnxruntime pulls in transitively.
[mypy-boto3.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-onnxruntime.*]
ignore_missing_imports = True

[mypy-tokenizers.*]
ignore_missing_imports = True

[mypy-fastapi.*]
ignore_missing_imports = True

[mypy-pydantic.*]
ignore_missing_imports = True

[mypy-mangum.*]
ignore_missing_imports = True
