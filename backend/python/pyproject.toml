[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "F",   # Pyflakes
    "E",   # pycodestyle errors
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[tool.ruff.lint.isort]
known-first-party = ["handlers", "services", "repositories", "utils", "schemas", "typedefs"]

[tool.mypy]
python_version = "3.13"
explicit_package_bases = true
mypy_path = "."
# Tightened 2026-07-27: the "start with basic checks, tighten incrementally"
# comment that stood here had outlived its moment — annotation coverage was
# already 68 of 86 definitions. The two flags below were the increment.
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

# Third-party libraries without stubs. Scoped per module on purpose: CI used to
# pass a global --ignore-missing-imports, which superseded this block entirely
# and silently tolerated any new untyped dependency. That flag is gone, so this
# list is now the only thing granting an exception and each entry has to earn
# its place.
#
# botocore.* was removed: mypy reports it under warn_unused_configs as an unused
# section, and `grep -rn botocore backend/python` finds no import. Verified with
# the same invocation CI now runs, not with a differently-configured one.
[[tool.mypy.overrides]]
module = [
    "boto3.*",
    "yfinance.*",
    "requests.*",
    "pandas.*",
]
ignore_missing_imports = true
