AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: NewsInvestor Backend - Lambda API for stock data (yfinance) and Finnhub news

Parameters:
  FinnhubApiKey:
    Type: String
    Description: Finnhub API key for news data
    NoEcho: true

  AlphaVantageApiKey:
    Type: String
    Description: Alpha Vantage API key for historical news (optional fallback)
    Default: ''
    NoEcho: true

  # SECURITY NOTE: Default '*' is intentional for this personal/demo app.
  # With no authentication, CORS provides no security benefit (nothing to protect
  # via same-origin policy). Configure via .env.deploy for production if needed.
  # See CLAUDE.md "Security Decisions" for full rationale.
  AllowedOrigins:
    Type: String
    Description: Comma-separated list of allowed CORS origins (e.g., https://example.com,https://www.example.com). Use '*' for development only.
    Default: '*'

  DistilFinBERTApiUrl:
    Type: String
    Description: URL of the DistilFinBERT ML service API
    Default: ''

  # --- Optimization Parameters ---

  # Lambda Configuration Parameters
  StocksMemory:
    Type: Number
    Default: 512
    MinValue: 128
    MaxValue: 10240
    Description: Memory for stocks endpoint (I/O bound)

  StocksTimeout:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 900
    Description: Timeout for stocks endpoint

  SentimentMemory:
    Type: Number
    Default: 1536
    MinValue: 128
    MaxValue: 10240
    Description: Memory for sentiment endpoint (CPU intensive)

  SentimentTimeout:
    Type: Number
    Default: 120
    MinValue: 1
    MaxValue: 900
    Description: Timeout for sentiment endpoint

  # Reserved concurrency is a bulkhead, and it cuts both ways: the value is
  # simultaneously a guarantee to the function and a hard ceiling on it, and it
  # is subtracted from the account's unreserved pool. The two values below sum
  # to 75 against an account default limit of 1,000, of which AWS requires at
  # least 100 stay unreserved.
  ReactStocksReservedConcurrency:
    Type: Number
    Default: 50
    MinValue: 0
    MaxValue: 900
    Description: >-
      Reserved concurrent executions for the Node API Lambda. Both a floor and
      a ceiling: this many executions are guaranteed to it and it can never
      exceed them. The value is subtracted from the account's unreserved pool,
      so the sum of every reservation in the account must stay well below the
      account concurrency limit (1,000 by default, and at least 100 must remain
      unreserved). Setting this to 0 does not mean "unlimited" -- it disables
      the function entirely, throttling every invocation.

  PythonStocksReservedConcurrency:
    Type: Number
    Default: 25
    MinValue: 0
    MaxValue: 900
    Description: >-
      Reserved concurrent executions for the Python stocks Lambda. Same
      semantics as ReactStocksReservedConcurrency: floor and ceiling at once,
      subtracted from the account's unreserved pool, and 0 disables the
      function rather than uncapping it.

  ThrottlingBurstLimit:
    Type: Number
    Default: 50
    Description: API Gateway burst limit (requests)

  ThrottlingRateLimit:
    Type: Number
    Default: 25
    Description: API Gateway steady-state rate limit (requests/second)

  DetailedApiMetrics:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: >-
      Emit per-route CloudWatch metrics for every route on the HTTP API.
      Default false because of what it costs, not because per-route data is
      unwanted: API Gateway bills detailed metrics as CloudWatch custom
      metrics, roughly six per route (Count, 4xx, 5xx, Latency,
      IntegrationLatency, DataProcessed), and this API has 15 routes. At
      $0.30 per metric per month that is about $27/month for a stack whose
      whole cost posture is PAY_PER_REQUEST. Stage-level Count/4xx/5xx/Latency
      are emitted free regardless, and ApiServerErrorAlarm uses them. Turn it
      on while investigating, then turn it back off.

  AlarmEmail:
    Type: String
    Default: ''
    Description: >-
      Email address to receive CloudWatch alarm notifications. Leave empty to
      create no subscription. Without it the alarms below change state in the
      console and tell nobody. AWS sends a confirmation email that must be
      accepted before any notification is delivered.

  EnableAlarms:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      Whether to create the CloudWatch alarms. CloudWatch bills per alarm that
      exists, not per alarm that fires, and there is no paused state: disabling
      an alarm's actions silences it while still charging for it. Setting this
      to 'false' on an existing stack deletes the alarms, because
      CloudFormation deletes a resource whose Condition stops being met;
      setting it back to 'true' recreates them. The default is 'true' so that a
      deploy which says nothing about alarms keeps them.

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]
  AlarmsEnabled: !Equals [!Ref EnableAlarms, 'true']
  # DetailedMetricsEnabled is a Boolean property, so the string parameter is
  # resolved through !If rather than passed through and relied on to coerce.
  HasDetailedApiMetrics: !Equals [!Ref DetailedApiMetrics, 'true']

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures:
      - x86_64
    Environment:
      Variables:
        NODE_ENV: production
        LOG_LEVEL: INFO
    Tracing: Active # Enable X-Ray tracing for debugging

Resources:
  # ============================================================
  # Unified DynamoDB Table (Single-Table Design)
  # ============================================================
  # See docs/plans/Phase-0.md ADR-003 for design rationale
  #
  # This table consolidates 7 previous tables into one using composite keys:
  # - PK: Entity type prefix + identifier (e.g., STOCK#AAPL, NEWS#AAPL, JOB#id)
  # - SK: Context-specific sort key (e.g., DATE#2024-01-15, HASH#abc123, META)
  #
  # Entity Types:
  # - STOCK#ticker + DATE#date: Stock price cache (TTL: 7-90 days)
  # - NEWS#ticker + HASH#hash: News article cache (TTL: 7 days)
  # - SENT#ticker + HASH#hash: Sentiment analysis cache (TTL: 30 days)
  # - JOB#jobId + META: Sentiment job status (TTL: 1 day)
  # - HIST#ticker + DATE#date: Historical price data (persistent)
  # - ARTICLE#ticker + HASH#hash#DATE#date: Article analysis (persistent)
  # - DAILY#ticker + DATE#date: Daily sentiment aggregate (persistent)
  # - CIRCUIT#service + STATE: Circuit breaker state (persistent)
  ReactStocksTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${AWS::StackName}-Table'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        Enabled: true
        AttributeName: ttl
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: news-investor
        - Key: Design
          Value: single-table

  # ============================================================
  # API Gateway v2 HTTP API
  # ============================================================
  ReactStocksApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-api'
      ProtocolType: HTTP
      # CORS configuration - see AllowedOrigins parameter for security rationale
      CorsConfiguration:
        AllowOrigins: !Split [',', !Ref AllowedOrigins]
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        MaxAge: 300
      Tags:
        Project: news-investor

  # Access logs for the HTTP API. There were none at all, so a 5xx that never
  # reached a Lambda — a routing miss or an integration timeout — left no
  # record anywhere.
  #
  # HTTP APIs (AWS::ApiGatewayV2::*) deliver access logs through a
  # service-linked role and do not need the account-level
  # AWS::ApiGateway::Account CloudWatchRole that REST APIs require. This
  # template declares no v1 API Gateway resource, so none is added.
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/${AWS::StackName}-api-access'
      RetentionInDays: 14 # matches the explicit Lambda log groups

  # API Gateway Stage
  ReactStocksApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref ReactStocksApi
      StageName: $default
      AutoDeploy: true
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        # Deliberately no headers, no query string and no body.
        # $context.identity.sourceIp is the only caller-identifying field and
        # is required to attribute abuse.
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","routeKey":"$context.routeKey","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength","integrationErrorMessage":"$context.integrationErrorMessage","responseLatency":"$context.responseLatency"}
      DefaultRouteSettings:
        ThrottlingBurstLimit: !Ref ThrottlingBurstLimit
        ThrottlingRateLimit: !Ref ThrottlingRateLimit
        DetailedMetricsEnabled: !If [HasDetailedApiMetrics, true, false]

  # Lambda Integration (Node.js - news, sentiment, predict)
  ReactStocksIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ReactStocksApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ReactStocksFunction.Arn
      PayloadFormatVersion: '2.0'

  # Lambda Integration (Python - stocks, search)
  PythonStocksIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ReactStocksApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt PythonStocksFunction.Arn
      PayloadFormatVersion: '2.0'

  # Routes
  StocksRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ReactStocksApi
      RouteKey: 'GET /stocks'
      Target: !Sub 'integrations/${PythonStocksIntegration}'

  NewsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ReactStocksApi
      RouteKey: 'GET /news'
      Target: !Sub 'integrations/${ReactStocksIntegration}'

  SearchRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ReactStocksApi
      RouteKey: 'GET /search'
      Target: !Sub 'integrations/${PythonStocksIntegration}'

  SentimentPostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ReactStocksApi
      RouteKey: 'POST /sentiment'
      Target: !Sub 'integrations/${ReactStocksIntegration}'

  SentimentGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ReactStocksApi
      RouteKey: 'GET /sentiment'
      Target: !Sub 'integrations/${ReactStocksIntegration}'

  SentimentJobRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ReactStocksApi
      RouteKey: 'GET /sentiment/job/{jobId}'
      Target: !Sub 'integrations/${ReactStocksIntegration}'

  SentimentArticlesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ReactStocksApi
      RouteKey: 'GET /sentiment/articles'
      Target: !Sub 'integrations/${ReactStocksIntegration}'

  DailyHistoryRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ReactStocksApi
      RouteKey: 'GET /sentiment/daily-history'
      Target: !Sub 'integrations/${ReactStocksIntegration}'

  PredictRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ReactStocksApi
      RouteKey: 'POST /predict'
      Target: !Sub 'integrations/${ReactStocksIntegration}'

  EarningsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ReactStocksApi
      RouteKey: 'GET /earnings'
      Target: !Sub 'integrations/${PythonStocksIntegration}'

  BatchEarningsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ReactStocksApi
      RouteKey: 'POST /batch/earnings'
      Target: !Sub 'integrations/${PythonStocksIntegration}'

  BatchStocksRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ReactStocksApi
      RouteKey: 'POST /batch/stocks'
      Target: !Sub 'integrations/${PythonStocksIntegration}'

  BatchNewsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ReactStocksApi
      RouteKey: 'POST /batch/news'
      Target: !Sub 'integrations/${ReactStocksIntegration}'

  BatchSentimentRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ReactStocksApi
      RouteKey: 'POST /batch/sentiment'
      Target: !Sub 'integrations/${ReactStocksIntegration}'

  EtfHoldingsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ReactStocksApi
      RouteKey: 'GET /etf-holdings'
      Target: !Sub 'integrations/${PythonStocksIntegration}'

  # Lambda Permission for API Gateway (Node.js)
  ApiGatewayInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ReactStocksFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ReactStocksApi}/*'

  # Lambda Permission for API Gateway (Python)
  PythonApiGatewayInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PythonStocksFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ReactStocksApi}/*'

  # ============================================================
  # Lambda Functions
  # ============================================================

  # Python Lambda Function for Stock Data (yfinance)
  PythonStocksFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-python-stocks'
      CodeUri: python/
      Handler: index.handler
      Runtime: python3.13
      MemorySize: !Ref StocksMemory
      Timeout: !Ref StocksTimeout
      Description: Stock data API using yfinance (replaces Tiingo)
      # The "cost bounded by Lambda concurrency" claim below and in CLAUDE.md
      # had nothing behind it: no function in this stack declared a
      # reservation, so a spike or a runaway loop could consume the account's
      # entire concurrency pool. Deliberately no ProvisionedConcurrency: it
      # bills continuously whether or not traffic arrives, against a stack that
      # is PAY_PER_REQUEST throughout.
      ReservedConcurrentExecutions: !Ref PythonStocksReservedConcurrency
      Environment:
        Variables:
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          DYNAMODB_TABLE_NAME: !Ref ReactStocksTable
          LOG_LEVEL: INFO
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Query
                - dynamodb:BatchGetItem
                - dynamodb:BatchWriteItem
              Resource:
                - !GetAtt ReactStocksTable.Arn
      Tracing: Active

  # NOTE: No API authentication by design. This is a community app with:
  # - No user accounts or private data
  # - Read-only/compute-only endpoints (no destructive operations)
  # - Cost bounded by Lambda concurrency and CloudWatch alarms
  # See CLAUDE.md "Security Decisions" for full rationale.
  ReactStocksFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-api'
      CodeUri: ./
      Handler: dist/index.handler
      # Sentiment is the heaviest API Gateway path; predictions run via
      # self-invocation and inherit the same function's config.
      MemorySize: !Ref SentimentMemory
      Timeout: !Ref SentimentTimeout
      Description: Backend proxy for Finnhub news and ML services
      # See PythonStocksFunction above for the bulkhead rationale. Note this
      # function also self-invokes for predictions, so a reservation of N caps
      # the request path and its prediction fan-out together.
      ReservedConcurrentExecutions: !Ref ReactStocksReservedConcurrency
      Environment:
        Variables:
          FINNHUB_API_KEY: !Ref FinnhubApiKey
          ALPHA_VANTAGE_API_KEY: !Ref AlphaVantageApiKey
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          DYNAMODB_TABLE_NAME: !Ref ReactStocksTable
          DISTILFINBERT_API_URL: !Ref DistilFinBERTApiUrl
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:BatchGetItem
                - dynamodb:BatchWriteItem
              Resource:
                - !GetAtt ReactStocksTable.Arn
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-api'

  # ============================================================
  # CloudWatch Log Groups
  # ============================================================
  # Declared explicitly so retention is bounded. Without these, Lambda
  # auto-creates its log groups with retention "Never Expire" and they accrue
  # storage charges forever. 14 days matches ml-template-onnx.yaml.
  #
  # NOTE: CloudFormation cannot adopt a log group that already exists, so these
  # only apply cleanly to a fresh stack. Deploying them over a stack whose
  # Lambdas have already run requires deleting the auto-created groups first.

  PythonStocksLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-python-stocks'
      RetentionInDays: 14

  ReactStocksLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-api'
      RetentionInDays: 14

  CalibrationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-calibration'
      RetentionInDays: 14

  # ============================================================
  # CloudWatch Alarms & Monitoring
  # ============================================================

  # SNS Topic for Cost Anomaly Notifications
  CostAnomalySNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${AWS::StackName}-CostAnomalyAlerts'
      DisplayName: 'NewsInvestor Cost Alerts'
      Tags:
        - Key: Project
          Value: news-investor

  # CloudWatch Alarms
  #
  # Every FunctionName dimension is !Ref <LogicalId>, which returns the
  # function name for AWS::Serverless::Function. Rebuilding the name with
  # !Sub '${AWS::StackName}-api' is correct only while the string and the
  # FunctionName property stay in step: a dimension naming a function the stack
  # does not create does not error, it produces an alarm parked in
  # INSUFFICIENT_DATA that reads as coverage and provides none.

  # Without this every alarm in this stack is decorative: it transitions to
  # ALARM in the console and notifies nothing.
  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref CostAnomalySNSTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail
  # The API-wide 5xx signal the stack did not have. Until now the only
  # indication of a failing API was the Lambda Errors alarm on the -api
  # function, which cannot see a failure that never reached a Lambda:
  # a routing miss or an integration timeout.
  #
  # Uses the stage-level dimension set (ApiId, Stage), which API Gateway emits
  # for free — DetailedApiMetrics only adds the per-route breakdown, and this
  # alarm works whether or not it is on.
  ApiServerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsEnabled
    Properties:
      AlarmDescription: >-
        The HTTP API is returning server errors across the stage. Check the
        access log group for the failing routeKey and integrationErrorMessage;
        a 5xx here that does not correspond to a Lambda Errors datapoint is an
        API Gateway-side failure rather than a handler failure.
      MetricName: 5xx
      Namespace: AWS/ApiGateway
      Dimensions:
        - Name: ApiId
          Value: !Ref ReactStocksApi
        - Name: Stage
          Value: $default
      Statistic: Sum
      Period: 300 # 5 minutes
      EvaluationPeriods: 2
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref CostAnomalySNSTopic
      OKActions:
        - !Ref CostAnomalySNSTopic

  LambdaInvocationsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsEnabled
    Properties:
      AlarmDescription: 'Lambda invocations exceeded expected threshold'
      MetricName: Invocations
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref ReactStocksFunction
      Statistic: Sum
      Period: 86400 # 1 day
      EvaluationPeriods: 1
      Threshold: 10000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref CostAnomalySNSTopic

  DynamoDBReadUnitsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsEnabled
    Properties:
      AlarmDescription: 'DynamoDB read units exceeded expected threshold'
      MetricName: ConsumedReadCapacityUnits
      Namespace: AWS/DynamoDB
      Dimensions:
        - Name: TableName
          Value: !Ref ReactStocksTable
      Statistic: Sum
      Period: 86400 # 1 day
      EvaluationPeriods: 1
      Threshold: 50000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref CostAnomalySNSTopic
      OKActions:
        - !Ref CostAnomalySNSTopic

  DynamoDBWriteThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsEnabled
    Properties:
      AlarmDescription: 'DynamoDB write throttle events detected - batch writes may lose data'
      MetricName: WriteThrottleEvents
      Namespace: AWS/DynamoDB
      Dimensions:
        - Name: TableName
          Value: !Ref ReactStocksTable
      Statistic: Sum
      Period: 300 # 5 minutes
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref CostAnomalySNSTopic

  LambdaDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsEnabled
    Properties:
      AlarmDescription: 'Lambda average duration exceeded threshold - potential cold starts or performance issues'
      MetricName: Duration
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref ReactStocksFunction
      Statistic: Average
      Period: 300 # 5 minutes
      EvaluationPeriods: 3
      Threshold: 5000 # 5 seconds average indicates issues
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref CostAnomalySNSTopic

  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsEnabled
    Properties:
      AlarmDescription: 'Lambda errors exceeded threshold'
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref ReactStocksFunction
      Statistic: Sum
      Period: 300 # 5 minutes
      EvaluationPeriods: 2
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref CostAnomalySNSTopic

  LambdaThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsEnabled
    Properties:
      AlarmDescription: 'Lambda throttles detected - consider increasing concurrency'
      MetricName: Throttles
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref ReactStocksFunction
      Statistic: Sum
      Period: 300 # 5 minutes
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref CostAnomalySNSTopic

  # ------------------------------------------------------------
  # Per-function alarms for the other two Lambdas
  # ------------------------------------------------------------
  #
  # The four alarms above watch ${StackName}-api and nothing else, so
  # python-stocks and calibration were unwatched. Calibration is EventBridge
  # scheduled with no caller to notice a failure.
  #
  # Thresholds are chosen so that the smallest real failure of that function
  # crosses them. "> 10 errors in 5 minutes" is right for a function serving
  # request traffic and unreachable for one invoked once a week: a calibration
  # run that fails throws exactly one error.

  PythonStocksErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsEnabled
    Properties:
      AlarmDescription: >-
        Python stocks Lambda errors exceeded threshold. Same shape as the Node
        API alarm: this function serves public request traffic, so a single
        500 is not worth waking someone for.
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref PythonStocksFunction
      Statistic: Sum
      Period: 300 # 5 minutes
      EvaluationPeriods: 2
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref CostAnomalySNSTopic

  CalibrationErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsEnabled
    Properties:
      AlarmDescription: >-
        Weekly signal calibration failed. Threshold 0: one run per week, so one
        error is the whole run. A failure leaves publisher reliability scores
        frozen at last week's values, which degrades silently.
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref SignalCalibrationFunction
      Statistic: Sum
      Period: 300 # 5 minutes
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref CostAnomalySNSTopic

  PythonStocksThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsEnabled
    Properties:
      AlarmDescription: 'Python stocks Lambda throttled - requests are being rejected before they run'
      MetricName: Throttles
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref PythonStocksFunction
      Statistic: Sum
      Period: 300 # 5 minutes
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref CostAnomalySNSTopic

  CalibrationThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsEnabled
    Properties:
      AlarmDescription: 'Signal calibration Lambda throttled - the weekly run was starved of concurrency'
      MetricName: Throttles
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref SignalCalibrationFunction
      Statistic: Sum
      Period: 300 # 5 minutes
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref CostAnomalySNSTopic

  PythonStocksDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsEnabled
    Properties:
      AlarmDescription: >-
        Python stocks Lambda average duration exceeded 10s. Sized against
        StocksTimeout, whose default is 30s: Duration can never exceed the
        configured timeout, so a threshold at or above it could not fire.
      MetricName: Duration
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref PythonStocksFunction
      Statistic: Average
      Period: 300 # 5 minutes
      EvaluationPeriods: 3
      Threshold: 10000 # 10s average against a 30s timeout
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref CostAnomalySNSTopic

  # Calibration gets no low-watermark Invocations alarm. CloudWatch caps an
  # alarm's total evaluation window at one day (EvaluationPeriods x Period <=
  # 86400) and this rule fires every 168 hours, so such an alarm would be in
  # ALARM six days out of seven. Its failure-to-invoke signal is the AWS/Events
  # FailedInvocations alarm below, which counts attempts EventBridge could not
  # deliver -- a case that produces no Lambda Errors datapoint at all, because
  # the function never ran.
  #
  # What it does NOT cover: a rule that stops firing at all. A rule set
  # State: DISABLED, or deleted outright, attempts no delivery, so it emits no
  # FailedInvocations datapoint any more than it emits Invocations. With the
  # weekly interval exceeding the evaluation cap, nothing in this stack detects
  # "the schedule silently stopped existing".

  WeeklyCalibrationFailedInvocationsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsEnabled
    Properties:
      AlarmDescription: >-
        EventBridge could not invoke the signal calibration Lambda. Check that
        WeeklyCalibrationPermission still grants events.amazonaws.com
        lambda:InvokeFunction on the function.
      MetricName: FailedInvocations
      Namespace: AWS/Events
      Dimensions:
        # !Ref on AWS::Events::Rule returns the rule name. This rule sets no
        # Name, so the name is CloudFormation-generated and cannot be written
        # out by hand.
        - Name: RuleName
          Value: !Ref WeeklyCalibrationSchedule
      Statistic: Sum
      Period: 300 # 5 minutes
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref CostAnomalySNSTopic

  SignalCalibrationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-calibration'
      CodeUri: ./
      Handler: dist/calibration.handler
      MemorySize: 512
      Timeout: 60
      Description: Weekly signal calibration (publisher reliability scoring)
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref ReactStocksTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
              Resource:
                - !GetAtt ReactStocksTable.Arn
                - !Sub '${ReactStocksTable.Arn}/index/EntityTypeIndex'

  WeeklyCalibrationSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: 'Trigger weekly signal calibration on Sunday midnight UTC'
      ScheduleExpression: 'cron(0 0 ? * SUN *)'
      State: ENABLED
      Targets:
        - Arn: !GetAtt SignalCalibrationFunction.Arn
          Id: WeeklyCalibrationTarget
          Input: '{"source": "events.schedule", "action": "calibrate"}'

  WeeklyCalibrationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SignalCalibrationFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt WeeklyCalibrationSchedule.Arn

Outputs:
  ReactStocksApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${ReactStocksApi}.execute-api.${AWS::Region}.amazonaws.com'
    Export:
      Name: !Sub '${AWS::StackName}-ApiUrl'

  ReactStocksFunctionArn:
    Description: Lambda Function ARN (Node.js - news, sentiment, predict)
    Value: !GetAtt ReactStocksFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-FunctionArn'

  PythonStocksFunctionArn:
    Description: Lambda Function ARN (Python - stocks, search)
    Value: !GetAtt PythonStocksFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-PythonFunctionArn'

  ReactStocksTableArn:
    Description: ARN of unified DynamoDB table
    Value: !GetAtt ReactStocksTable.Arn
    Export:
      Name: !Sub '${AWS::StackName}-TableArn'

  ReactStocksTableName:
    Description: Name of unified DynamoDB table
    Value: !Ref ReactStocksTable
    Export:
      Name: !Sub '${AWS::StackName}-TableName'

  CostAnomalySNSTopicArn:
    Description: SNS Topic ARN for cost anomaly alerts
    Value: !Ref CostAnomalySNSTopic
    Export:
      Name: !Sub '${AWS::StackName}-CostAnomalySNSTopicArn'
